<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question View - CodeHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230f172a'/><path d='M30 35 L15 50 L30 65' stroke='%2338bdf8' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M70 35 L85 50 L70 65' stroke='%23818cf8' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><line x1='56' y1='30' x2='44' y2='70' stroke='%23f8fafc' stroke-width='8' stroke-linecap='round'/></svg>">
    <!-- Prism Syntax Highlighting Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        .code-container { position: relative; }
        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #334155;
            color: #f8fafc;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 4px;
            border: 1px solid #475569;
            cursor: pointer;
        }
        .copy-btn:hover { background: #475569; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0a0f1c;
            --bg-card:#111827;
            --card:#111827;
            --border:#1e293b;
            --primary:#38bdf8;
            --primary-2:#818cf8;
            --text-muted:#94a3b8;
            --danger:#f87171;
        }
        *{ box-sizing:border-box; }
        html{ scroll-behavior:smooth; }
        body{
            background:var(--bg) radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56,189,248,0.10), transparent);
            color:#f1f5f9;
            font-family:'Inter', -apple-system, sans-serif;
            margin:0;
            min-height:100vh;
        }
        h1,h2,h3,h4{
            font-family:'Poppins', 'Inter', sans-serif;
            font-weight:600;
            letter-spacing:-0.01em;
        }
        nav{
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            justify-content:space-between;
            gap:1rem;
            padding:1rem 2rem;
            background:linear-gradient(135deg, #0d1526 0%, #131c30 55%, #16213a 100%);
            border-bottom:1px solid var(--border);
            box-shadow:0 1px 0 rgba(56,189,248,0.15), 0 8px 24px -12px rgba(0,0,0,0.6);
            position:sticky;
            top:0;
            z-index:50;
        }
        nav h2{
            background:linear-gradient(90deg, #f8fafc, #cbd5e1);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }
        nav div{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
        nav a{
            color:var(--text-muted);
            text-decoration:none;
            font-weight:500;
            font-size:0.92rem;
            padding:0.5rem 0.9rem;
            border-radius:8px;
            transition:color 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }
        nav a:hover{
            color:#f8fafc;
            background:rgba(56,189,248,0.10);
            transform:translateY(-1px);
        }
        .container{ max-width:1080px; margin:0 auto; padding:2.5rem 1.5rem; }
        .hero{ text-align:center; padding-top:4rem; padding-bottom:3rem; }
        .hero h1{
            font-size:clamp(1.9rem, 4vw, 2.75rem);
            background:linear-gradient(90deg, var(--primary), var(--primary-2));
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            margin-bottom:0.75rem;
            line-height:1.15;
        }
        .card{
            background:var(--bg-card);
            border:1px solid var(--border);
            border-radius:14px;
            padding:1.4rem;
            text-decoration:none;
            color:inherit;
            display:block;
            transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover{
            transform:translateY(-4px);
            border-color:rgba(56,189,248,0.5);
            box-shadow:0 12px 30px -10px rgba(56,189,248,0.25);
        }
        .card h3{ color:#f8fafc; }
        button, .pill{
            font-family:'Inter', sans-serif;
            cursor:pointer;
        }
        button{
            background:linear-gradient(90deg, var(--primary), var(--primary-2));
            color:#0a0f1c;
            border:none;
            font-weight:600;
            padding:0.65rem 1.3rem;
            border-radius:9px;
            transition:box-shadow 0.25s ease, transform 0.15s ease, filter 0.2s ease;
            box-shadow:0 0 0 rgba(56,189,248,0);
        }
        button:hover{
            box-shadow:0 0 22px rgba(56,189,248,0.55);
            transform:translateY(-1px);
            filter:brightness(1.05);
        }
        button:active{ transform:translateY(0); }
        button.danger{
            background:#1e293b;
            color:#fca5a5;
            border:1px solid rgba(248,113,113,0.4);
        }
        button.danger:hover{
            box-shadow:0 0 18px rgba(248,113,113,0.35);
            background:#241a1f;
        }
        input, select, textarea{
            background:#0d1526;
            border:1px solid var(--border);
            color:#f1f5f9;
            border-radius:8px;
            padding:0.65rem 0.85rem;
            font-family:'Inter', sans-serif;
            transition:border-color 0.2s ease, box-shadow 0.2s ease;
            width:100%;
        }
        input:focus, select:focus, textarea:focus{
            outline:none;
            border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(56,189,248,0.15);
        }
        .search-box input{ max-width:100%; }
        .topic-pills{ display:flex; flex-wrap:wrap; gap:0.6rem; margin:1.25rem 0; }
        .pill{
            display:inline-block;
            width:auto;
            padding:0.4rem 0.95rem;
            border-radius:999px;
            border:1px solid var(--border);
            color:var(--text-muted);
            font-size:0.85rem;
            transition:all 0.2s ease;
        }
        .pill:hover{ border-color:var(--primary); color:#f8fafc; }
        .pill.active{
            background:linear-gradient(90deg, var(--primary), var(--primary-2));
            color:#0a0f1c;
            border-color:transparent;
            font-weight:600;
            box-shadow:0 0 14px rgba(56,189,248,0.4);
        }
        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
            gap:1.25rem;
            margin-top:1.5rem;
        }
        .tag{
            display:inline-block;
            background:#0d1526;
            border:1px solid var(--border);
            color:var(--text-muted);
            font-size:0.78rem;
            padding:0.25rem 0.65rem;
            border-radius:6px;
            margin-right:0.4rem;
        }
        .tag.Easy{ color:#4ade80; border-color:rgba(74,222,128,0.35); }
        .tag.Medium{ color:#fbbf24; border-color:rgba(251,191,36,0.35); }
        .tag.Hard{ color:#f87171; border-color:rgba(248,113,113,0.35); }
        pre{
            border-radius:10px;
            border:1px solid var(--border);
        }
        ::-webkit-scrollbar{ width:10px; height:10px; }
        ::-webkit-scrollbar-track{ background:var(--bg); }
        ::-webkit-scrollbar-thumb{ background:#1e293b; border-radius:6px; }
        @media (max-width: 640px){
            nav{ padding:0.85rem 1.1rem; flex-direction:column; align-items:flex-start; }
            nav div{ width:100%; justify-content:flex-start; }
            .container{ padding:1.75rem 1.1rem; }
            .hero > div{ flex-direction:column; align-items:stretch; }
            .hero a.card{ width:100% !important; }
        }
    </style>
</head>
<body>

        <a href="index.html"><h2>CodeHub</h2></a>
        <div>
            <a href="dsa.html">DSA</a>
            <a href="cpp.html">C++</a>
        </div>
    </nav> -->
    <nav>
    <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="28" height="28" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="25" fill="#1e293b"/>
            <path d="M30 35 L15 50 L30 65" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M70 35 L85 50 L70 65" stroke="#818cf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <line x1="56" y1="30" x2="44" y2="70" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
        </svg>
        <h2 style="margin: 0;">CodeHub</h2>
    </div>
    <div>
        <a href="index.html">← Home</a>
        <a href="dsa.html">DSA Track</a>
        <a href="cpp.html">C++ Track</a>
    </div>
</nav>
    <div class="container" id="content">
        <p style="color: var(--text-muted)">Loading question...</p>
    </div>

    <!-- Prism JS Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>

    <script>
        const id = new URLSearchParams(window.location.search).get('id');

        async function loadQuestion() {
            try {
                const res = await fetch(`/api/questions/${id}`);
                if (!res.ok) {
                    document.getElementById('content').innerHTML = '<h2>Question Not Found</h2>';
                    return;
                }
                const q = await res.json();
                
                // Escape HTML characters in raw code
                const sanitizedCode = (q.solution_code || '// No code provided')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                document.getElementById('content').innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <span class="tag ${q.difficulty}">${q.difficulty}</span>
                        <span class="tag">${q.category}</span>
                        <span class="tag">${q.section} &gt; ${q.topic}</span>
                    </div>
                    <h1 style="margin-bottom: 1.5rem;">${q.title}</h1>
                    
                    <h3 style="color: var(--primary);">Problem Statement</h3>
                    <div style="white-space: pre-wrap; margin: 0.8rem 0 2rem; line-height: 1.6; color: #cbd5e1; background: var(--card); padding: 1.2rem; border-radius: 8px; border: 1px solid var(--border);">${q.problem_statement}</div>
                    
                    <h3 style="color: var(--primary);">C++ Solution</h3>
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCode()">Copy</button>
                        <pre><code id="codeBlock" class="language-cpp">${sanitizedCode}</code></pre>
                    </div>

                    <h3 style="color: var(--primary); margin-top: 2rem;">Explanation</h3>
                    <div style="white-space: pre-wrap; margin-top: 0.8rem; line-height: 1.6; color: #cbd5e1; background: var(--card); padding: 1.2rem; border-radius: 8px; border: 1px solid var(--border);">${q.solution_explanation || 'No explanation provided.'}</div>
                `;

                // Trigger Prism highlighter
                Prism.highlightAll();
            } catch (err) {
                document.getElementById('content').innerHTML = '<p>Error loading content.</p>';
            }
        }

        function copyCode() {
            const code = document.getElementById('codeBlock').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
